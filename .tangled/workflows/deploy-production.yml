# Deploy production to Fly.io (fly.toml). Triggered by pushing a `v*` tag:
#
#   git tag v0.4.0 main && git push tangled v0.4.0
#
# Spindle has no deployment environments or required reviewers, so the tag push is the approval
# gate: pushing to main deploys nothing. Only accounts with write access can push a tag, unlike
# a pull request, which anyone can open. `manual` is listed too for when Tangled's UI can start
# one; it has no run button yet. There are no concurrency groups — don't push a second tag
# while a deploy is in flight.
#
# The run is refused unless its commit is on main, whichever tag or ref started it. Spindle
# clones only the triggering commit, so the check fetches main and tests ancestry.
#
# The image is built remotely by `flyctl deploy --remote-only`, so this workflow needs no Node
# toolchain; the Dockerfile runs `npm ci` in its builder stage.
#
# Repo secrets (Settings → Secrets). Spindle secrets are repo-wide — every workflow, including
# test runs for pull requests, can read them — so FLY_API_TOKEN must be a deploy token
# scoped to the production app alone: `fly tokens create deploy -a <prod-app>`.
#   FLY_API_TOKEN — deploy token for the production app.
#   FLY_APP_NAME — the real app name (fly.toml holds a placeholder).
#   VITE_MERCHANT_DID — passed as a Docker build-arg (see Fly deploy step).
#
# Runtime secrets live on the Fly app itself, as before — see packages/server/.env.example.

when:
  - event: ["push"]
    tag: ["v*"]
  - event: ["manual"]

engine: "nixery"

dependencies:
  nixpkgs:
    - flyctl
    - coreutils
    - git

steps:
  # Fails in seconds, before contacting Fly, and names every missing secret at once. Only
  # secret NAMES are ever printed; values are never echoed.
  - name: Verify ref and required secrets
    command: |
      set -euo pipefail
      git fetch --quiet origin main
      if ! git merge-base --is-ancestor "$TANGLED_SHA" FETCH_HEAD; then
        echo "Deploy aborted: ${TANGLED_SHA} (${TANGLED_REF_NAME:-<no ref>}) is not on main. Production deploys only commits on main."
        exit 1
      fi
      echo "Deploying ${TANGLED_REF_NAME:-<no ref>} @ ${TANGLED_SHA} (on main) to production."
      required=(
        FLY_API_TOKEN
        FLY_APP_NAME
        VITE_MERCHANT_DID
      )
      missing=()
      for name in "${required[@]}"; do
        if [ -z "${!name:-}" ]; then
          missing+=("$name")
        fi
      done
      if [ "${#missing[@]}" -eq 0 ]; then
        echo "All required production deploy secrets are set (values are never printed)."
        exit 0
      fi
      echo "Deploy aborted before contacting Fly — required repo secrets are missing or empty:"
      for name in "${missing[@]}"; do
        echo "  - ${name}"
      done
      exit 1

  - name: Fly deploy
    command: |
      set -euo pipefail
      flyctl deploy --remote-only --no-cache \
        --app "$FLY_APP_NAME" \
        --build-arg VITE_MERCHANT_DID="$VITE_MERCHANT_DID"
