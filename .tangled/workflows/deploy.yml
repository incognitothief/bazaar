# Deploy: Pulumi (state in Cloudflare R2) then Fly.io.
# Pipeline secrets (repository settings; not in this file):
#   CLOUDFLARE_API_TOKEN — Cloudflare API (Pulumi provider)
#   CLOUDFLARE_ACCOUNT_ID — same as bazaar-infra:cloudflareAccountId (avoid committing stack config)
#   PULUMI_CONFIG_PASSPHRASE — set when spinning up the stack locally
#   PULUMI_BACKEND_URL — e.g. s3://bazaar-pulumi-state-prod?endpoint=https://<account>.r2.cloudflarestorage.com&region=auto&s3ForcePathStyle=true
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY — R2 S3 API keys for the state bucket
#   FLY_API_TOKEN
# Bootstrap the stack once locally (file backend → up → export → login s3 → import); see packages/infra/index.ts.
# See https://docs.tangled.org/spindles.html#pipelines

when:
  - event: ["push", "manual"]
    branch: ["main"]

engine: "nixery"

clone:
  depth: 1
  submodules: false

dependencies:
  nixpkgs:
    - nodejs
    - pulumi-bin
    - flyctl

environment:
  NODE_ENV: production
  # Pulumi (Go user.Current) needs USER when the image has no cgo/passwd entry.
  USER: ci
  HOME: /tmp
  # Non-secret; change to match your Pulumi stack name.
  PULUMI_STACK: prod

steps:
  - name: Install dependencies
    command: npm ci

  - name: Pulumi up (Cloudflare R2)
    command: |
      set -euo pipefail
      if [ -z "${PULUMI_STACK:-}" ]; then
        echo "Set PULUMI_STACK in the workflow environment section."
        exit 1
      fi
      if [ -z "${PULUMI_BACKEND_URL:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
        echo "Set PULUMI_BACKEND_URL, AWS_ACCESS_KEY_ID, and AWS_SECRET_ACCESS_KEY (R2 S3 API) in pipeline secrets."
        exit 1
      fi
      export PULUMI_BACKEND_URL
      export AWS_ACCESS_KEY_ID
      export AWS_SECRET_ACCESS_KEY
      export AWS_REGION=auto
      export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-}"
      export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-}"
      export PULUMI_CONFIG_PASSPHRASE="${PULUMI_CONFIG_PASSPHRASE:-}"
      cd packages/infra
      pulumi up --yes --stack "${PULUMI_STACK}"

  - name: Fly deploy
    command: flyctl deploy --remote-only
