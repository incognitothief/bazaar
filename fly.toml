# Placeholder. The real app name is passed at deploy time with --app, from FLY_APP locally or
# the FLY_APP_NAME secret in CI, so this file stays the same in every fork.
# Staging uses fly.stg.toml (separate app and volume).
app = "your-app-name"
primary_region = "ams"

[build]

# Server env for Bun (not Vite): merchant routes need MERCHANT_DID == store owner did (same as VITE_MERCHANT_DID).
#   fly secrets set MERCHANT_DID=did:plc:…
[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpus = 2
  cpu_kind = "shared"
  memory = "2048mb"

# Create once, with the name below: fly volumes create bazaar_data_prd --region ams --size 1 -a <your-app>
[[mounts]]
  source = "bazaar_data_prd"
  destination = "/data"
