# Rename `app` to your Fly app name before the first deploy.
app = "bazaar"
primary_region = "iad"

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpus = 1
  cpu_kind = "shared"
  memory = "512mb"

# Create once: fly volumes create bazaar_data --region iad --size 1
[[mounts]]
  source = "bazaar_data"
  destination = "/data"
