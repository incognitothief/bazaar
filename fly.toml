# Rename `app` to your Fly app name before the first deploy.
# Staging uses fly.stg.toml (separate app and volume).
app = "bazaar-g5nqca"
primary_region = "ams"

[build]

# Server env for Bun (not Vite): merchant routes need ARTIST_DID == store owner did (same as VITE_ARTIST_DID).
#   fly secrets set ARTIST_DID=did:plc:…
[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpus = 1
  cpu_kind = "shared"
  memory = "512mb"

# Create once: fly volumes create bazaar_data_prod --region ams --size 1
[[mounts]]
  source = "bazaar_data_prd"
  destination = "/data"
