# Placeholder. The real app name is passed at deploy time with --app (FLY_APP / FLY_APP_NAME).
app = "your-staging-app-name"
primary_region = "iad"

[build]

# Same as prod: set MERCHANT_DID (and other server secrets) on this app via fly secrets set.
[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpus = 1
  cpu_kind = "shared"
  memory = "512mb"

# Create once, with the name below. Same name as production's volume, which is fine: volumes
# belong to an app, so this one is only ever reachable from the staging app.
#   fly volumes create bazaar_data --region iad --size 1 -a <your-staging-app>
[[mounts]]
  source = "bazaar_data"
  destination = "/data"
