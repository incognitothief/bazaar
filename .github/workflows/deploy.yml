# Deploy: Pulumi (state in Cloudflare R2) then Fly.io.
#
# GitHub repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN — Cloudflare API (Pulumi provider)
#   CLOUDFLARE_ACCOUNT_ID — same as bazaar-infra:cloudflareAccountId
#   PULUMI_CONFIG_PASSPHRASE — if the stack uses passphrase-encrypted config secrets
#   PULUMI_BACKEND_URL — s3://… R2 backend URL (query params for endpoint/region)
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY — R2 S3 API keys for the state bucket
#   FLY_API_TOKEN
#
# Optional repository variable: PULUMI_STACK (defaults to prod).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      PULUMI_STACK: ${{ vars.PULUMI_STACK || 'prod' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Install Pulumi CLI only (omit `command`); see https://github.com/pulumi/actions
      - uses: pulumi/actions@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install dependencies
        run: npm ci

      - name: Pulumi up (Cloudflare R2)
        working-directory: packages/infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not set."
            exit 1
          fi
          if [ -z "${PULUMI_BACKEND_URL:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "Set PULUMI_BACKEND_URL, AWS_ACCESS_KEY_ID, and AWS_SECRET_ACCESS_KEY secrets."
            exit 1
          fi
          pulumi up --yes --stack "${PULUMI_STACK}"

      - name: Fly deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
