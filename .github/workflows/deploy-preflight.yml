# Fail fast before deploy if required repository secrets are missing.
# Only secret *names* are printed when something is wrong; values are never echoed.
# Optional (not checked): PULUMI_CONFIG_PASSPHRASE — only when the Pulumi stack uses passphrase-encrypted config.
# See deploy.yml for secret descriptions.

name: Deploy preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VITE_ATPROTO_SERVICE: ${{ secrets.VITE_ATPROTO_SERVICE }}
          VITE_APP_DID: ${{ secrets.VITE_APP_DID }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_LEXICON_NAMESPACE: ${{ secrets.VITE_LEXICON_NAMESPACE }}
          VITE_ARTIST_DID: ${{ secrets.VITE_ARTIST_DID }}
          VITE_API_ORIGIN: ${{ secrets.VITE_API_ORIGIN }}
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            PULUMI_BACKEND_URL
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            FLY_API_TOKEN
            VITE_ATPROTO_SERVICE
            VITE_APP_DID
            VITE_APP_URL
            VITE_LEXICON_NAMESPACE
            VITE_ARTIST_DID
            VITE_API_ORIGIN
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All required deploy secrets are non-empty (values are not logged)."
            exit 0
          fi
          echo "::error::Missing or empty required GitHub Actions secrets. Set these names under Settings → Secrets and variables → Actions (values are never printed by this job):"
          for name in "${missing[@]}"; do
            echo "::error::  - ${name}"
          done
          exit 1
