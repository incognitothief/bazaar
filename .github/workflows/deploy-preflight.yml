# Fail fast before deploy if required secrets are missing.
# Only secret *names* are printed when something is wrong; values are never echoed.
#
# Production preflight: push to main (and workflow_dispatch on main).
# Staging preflight runs only when ALL hold:
#   - event is pull_request
#   - repository variable DEPLOY_STG is exactly true or 1 (Settings → Secrets and variables → Actions → Variables)
#   - PR branch is from this repo (not a fork)
# Otherwise the staging job is skipped by design so PRs do not fail when staging is off.
# See deploy.yml (same gates for deploy-staging).

name: Deploy preflight

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-secrets-production:
    name: Required secrets (production)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify required deploy secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_MERCHANT_DID: ${{ secrets.VITE_MERCHANT_DID }}
          VITE_API_ORIGIN: ${{ secrets.VITE_API_ORIGIN }}
        run: |
          set -euo pipefail
          required=(
            FLY_API_TOKEN
            FLY_APP_NAME
            VITE_APP_URL
            VITE_MERCHANT_DID
            VITE_API_ORIGIN
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All required production deploy secrets are non-empty (values are not logged)."
            exit 0
          fi
          echo "::error::Missing or empty required GitHub Actions secrets for production. Set these under the production environment or repository secrets (values are never printed by this job):"
          for name in "${missing[@]}"; do
            echo "::error::  - ${name}"
          done
          exit 1

  staging-preflight-skipped-hint:
    name: Staging preflight (not enabled)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.DEPLOY_STG != 'true' &&
      vars.DEPLOY_STG != '1'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: |
          echo "::notice::Staging preflight and deploy-staging are skipped. Set repository variable DEPLOY_STG to true (or 1) under Settings → Secrets and variables → Actions → Variables. Fork PRs never run staging jobs."

  required-secrets-staging:
    name: Required secrets (staging)
    if: >-
      github.event_name == 'pull_request' &&
      (vars.DEPLOY_STG == 'true' || vars.DEPLOY_STG == '1') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Verify required deploy secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME_STG }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_MERCHANT_DID: ${{ secrets.VITE_MERCHANT_DID }}
          VITE_API_ORIGIN: ${{ secrets.VITE_API_ORIGIN }}
        run: |
          set -euo pipefail
          required=(
            FLY_API_TOKEN
            FLY_APP_NAME
            VITE_APP_URL
            VITE_MERCHANT_DID
            VITE_API_ORIGIN
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All required staging deploy secrets are non-empty (values are not logged)."
            exit 0
          fi
          echo "::error::Missing or empty required GitHub Actions secrets for staging. Set these under the staging environment or repository secrets (values are never printed by this job):"
          for name in "${missing[@]}"; do
            echo "::error::  - ${name}"
          done
          exit 1
