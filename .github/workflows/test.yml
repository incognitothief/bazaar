# CI: lexicon verification, monorepo build, server unit tests.
# No secrets required.

name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Bazaar lexicons
        run: npm run lexicons:validate

      - name: Build workspaces
        run: npm run build

      - name: Server unit tests
        run: npm run test -w @bazaar/server
